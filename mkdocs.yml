site_name: RXMesh
site_url: https://mydomain.org/mysite
repo_url: https://github.com/owensgroup/RXMesh
repo_name: RXMesh
theme: 
  name: material
  logo: assets/rx.png
  favicon: assets/rx.png
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: white
    accent: light green 
  font:
    text: 'PT Serif'
    code: 'Inconsolata'     
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.tabs.link   
    # - toc.integrate
    - navigation.top
    - content.code.copy        
    - navigation.indexes    

markdown_extensions:
  - attr_list
  - md_in_html  
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - About: 
    - Building: about/building.md        
    - Bibtex: about/bibtex.md
  - Basics:
    - Getting Started: basics/basic.md
  - User's Guide: 
    - RXMeshStatic: 
      - Overview: rxmesh/static.md
      - Initialization: rxmesh/initialization.md
      - Attributes Management: rxmesh/attributes_management.md
      - Operations:         
        - for_each: rxmesh/for_each.md
        - run_query_kernel: rxmesh/run_query_kernel.md
        - run_kernel: rxmesh/run_kernel.md
      - Visualization: rxmesh/visualization.md
      - Indexing: rxmesh/indexing.md      
      - Misc: rxmesh/static_misc.md
    - Attributes: rxmesh/attributes.md
    - Reduction: rxmesh/reduce_handle.md
    - Matrices:
      - Dense Matrices: rxmesh/dense_matrices.md
      - Sparse Matrices: rxmesh/sparse_matrices.md
    - Solvers: rxmesh/solvers.md
    - RXMeshDynamic: rxmesh/dynamic.md    
    - Autodiff: rxmesh/ad.md
    - Applications: rxmesh/apps.md
  - References: 
    - Handles: rxmesh/handles.md
    - Iterators: rxmesh/iterators.md
    - LaunchBox: rxmesh/launch_box.md
    - Logging: rxmesh/logging.md
    - ShmemAllocator: rxmesh/shmem_allocator.md
    - Query: rxmesh/query.md
    - Cavity: rxmesh/cavity.md