site_name: RXMesh
site_url: https://ahdhn.github.io/RXMeshDocs/
repo_url: https://github.com/owensgroup/RXMesh
repo_name: RXMesh
theme: 
  name: material
  logo: assets/rx.svg
  favicon: assets/rx.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: white
    accent: light green 
  font:
    text: 'PT Serif'
    code: 'Inconsolata'     
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.tabs.link   
    - navigation.top
    - content.code.copy        
    - navigation.indexes    

markdown_extensions:
  - attr_list
  - md_in_html  
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Building: getting-started/building.md
    - Your First Application: getting-started/first-app.md
    - Key Concepts: getting-started/concepts.md
  - Static Mesh Processing:
    - Overview: rxmesh/static.md
    - Initialization: rxmesh/initialization.md
    - Attributes:
      - Managing Attributes: rxmesh/managing_attributes.md
      - Working with Attributes: rxmesh/working_with_attributes.md
    - Operations:
      - for_each: rxmesh/for_each.md
      - Custom Kernels: rxmesh/run_kernel.md
    - Reductions: rxmesh/reduce_handle.md
    - Visualization: rxmesh/visualization.md
    - Indexing: rxmesh/indexing.md
    - Utilities: rxmesh/static_misc.md
  - Matrices & Solvers:
    - Dense Matrices: rxmesh/dense_matrices.md
    - Sparse Matrices: rxmesh/sparse_matrices.md
    - Linear Solvers: rxmesh/solvers.md
  - Dynamic Mesh Processing:
    - Overview: rxmesh/dynamic.md
    - Cavity Operations: rxmesh/cavity.md
  - Automatic Differentiation:
    - Overview: rxmesh/ad.md
    - Dual Numbers: rxmesh/diff/scalar.md
    - Terms: rxmesh/diff/terms.md
    - Scalar Problem: rxmesh/diff/scalar_problem.md
    - Vector Problem: rxmesh/diff/vector_problem.md
    - Non-linear Solvers: rxmesh/diff/nonlinear_solvers.md
    - Advanced Topics: rxmesh/diff/advanced.md
  - Applications & Examples: rxmesh/apps.md
  - Reference:
    - Handles: rxmesh/handles.md
    - Iterators: rxmesh/iterators.md
    - LocationT: rxmesh/location_t.md
    - Query Object: rxmesh/query.md
    - LaunchBox: rxmesh/launch_box.md
    - ShmemAllocator: rxmesh/shmem_allocator.md
    - Logging: rxmesh/logging.md
  - About:
    - Citation: about/bibtex.md
    - License: about/license.md
