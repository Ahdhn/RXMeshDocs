site_name: RXMesh
site_url: https://ahdhn.github.io/RXMeshDocs/
repo_url: https://github.com/owensgroup/RXMesh
repo_name: RXMesh
theme: 
  name: material
  logo: assets/rx.svg
  favicon: assets/rx.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: white
    accent: light green 
  font:
    text: 'PT Serif'
    code: 'Inconsolata'     
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.tabs.link   
    - navigation.top
    - content.code.copy        
    - navigation.indexes    

markdown_extensions:
  - attr_list
  - md_in_html  
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Building: getting-started/building.md
    - Your First Application: getting-started/first-app.md
    - Key Concepts: getting-started/concepts.md
  - Static Mesh Processing:
    - Overview: rxmesh/static/static.md
    - Initialization: rxmesh/static/initialization.md
    - Attributes:
      - Managing Attributes: rxmesh/static/managing_attributes.md
      - Working with Attributes: rxmesh/static/working_with_attributes.md
    - Operations:
      - for_each: rxmesh/static/for_each.md
      - Custom Kernels: rxmesh/static/run_kernel.md
    - Reductions: rxmesh/static/reduce_handle.md
    - Visualization: rxmesh/static/visualization.md
    - Indexing: rxmesh/static/indexing.md
    - Utilities: rxmesh/static/static_misc.md
  - Matrices & Solvers:
    - Dense Matrices: rxmesh/matrix/dense_matrices.md
    - Sparse Matrices: rxmesh/matrix/sparse_matrices.md
    - Linear Solvers: rxmesh/matrix/solvers.md  
  - Automatic Differentiation:
    - Overview: rxmesh/diff/ad.md
    - Dual Numbers: rxmesh/diff/scalar.md    
    - Scalar Problem: rxmesh/diff/scalar_problem.md
    - Vector Problem: rxmesh/diff/vector_problem.md
    - Terms: rxmesh/diff/terms.md
    - Non-linear Solvers: rxmesh/diff/nonlinear_solvers.md
    - Advanced Topics: rxmesh/diff/advanced.md
  - Dynamic Mesh Processing:
    - Overview: rxmesh/dyn/dynamic.md
    - RXMeshDynamic: rxmesh/dyn/rxmesh_dynamic.md
    - Cavity Operations:
      - Concepts: rxmesh/dyn/cavity.md
      - CavityOp: rxmesh/dyn/cavity_op.md
      - CavityManager: rxmesh/dyn/cavity_manager.md
      - DEdgeHandle: rxmesh/dyn/dedge_handle.md    
  - Reference:
    - Handles: rxmesh/reference/handles.md
    - Iterators: rxmesh/reference/iterators.md
    - LocationT: rxmesh/reference/location_t.md
    - Context: rxmesh/reference/context.md
    - Query Object: rxmesh/reference/query.md
    - LaunchBox: rxmesh/reference/launch_box.md
    - ShmemAllocator: rxmesh/reference/shmem_allocator.md
    - Logging: rxmesh/reference/logging.md
  - About:
    - Citation: about/bibtex.md
    - License: about/license.md
